# ======================================================================
# Application under test
# ======================================================================
baseUrl=https://www.olx.com.pk
environment=qa

# ======================================================================
# Browser configuration
# browser: chrome | firefox | edge
# ======================================================================
browser=chrome
headless=false

# Driver binary resolution: selenium | webdrivermanager
# Selenium Manager (built into Selenium 4.6+) is the default. WebDriverManager
# currently fails for Edge: it resolves msedgedriver from
# msedgedriver.azureedge.net, a CDN Microsoft has retired.
driverResolver=selenium
maximize=true
windowWidth=1920
windowHeight=1080

# ======================================================================
# Timeouts (seconds)
#
# implicitWait stays at 0 on purpose. Mixing implicit and explicit waits
# makes every WebDriverWait poll unpredictably, so the framework relies on
# explicit waits only.
# ======================================================================
timeout=30
pageLoadTimeout=60
pollingIntervalMillis=250
implicitWait=0

# ======================================================================
# Artifacts
# screenshotOnFailure: true captures a PNG and attaches it to the report
# ======================================================================
screenshotOnFailure=true
reportsDir=reports
screenshotsDir=screenshots
